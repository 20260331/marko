rubrics:
  - id: 1
    type: p2p
    text: 回归要求：未使用本地化接口时，Markdown 的现有解析和渲染行为保持不变，既有测试不得回归。

  - id: 2
    type: f2p
    text: 导出能力：可从 Markdown 生成本地化目录，同一承载内容的块中，文本与相邻结构保留在同一句子级条目内，而不是拆成多个 RawText 片段。

  - id: 3
    type: f2p
    text: 结构隔离：导出结果将链接、强调和代码等结构表达为占位符或受保护元数据，译者只能获得可翻译文本，不能直接改动链接目标、代码内容或结构标记。

  - id: 4
    type: f2p
    text: 应用能力：可使用译文重建 Markdown，未翻译条目保持原文本，占位符可随译文重排；链接文本或强调文本等嵌套可译内容应能直接应用，不得要求额外填写无实际内容的外层占位符译文。

  - id: 5
    type: f2p
    text: 占位符校验：应用前必须拒绝缺失、重复或未知占位符，以及译文自行引入或删除 Markdown 结构的情况。

  - id: 6
    type: f2p
    text: 结构保真：链接文本或强调文本中出现 `]`、`[`、`*` 等 Markdown 定界符时，应用后的 Markdown 重新解析仍须保持原链接或强调结构，结构被译文破坏时必须拒绝而不是静默输出。

  - id: 7
    type: f2p
    text: 失败原子性：结构校验失败时不得应用该译文，也不得使作为输入的解析文档留下部分修改。
